server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The export is built without threads, so no COOP/COEP headers are needed.
    # nginx's stock mime.types already maps .wasm to application/wasm.

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri =404;
    }
}
