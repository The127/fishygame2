name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Single place to bump the Godot version.
  GODOT_VERSION: "4.7.2"
  # SHA-512 of the release downloads, from the release's SHA512-SUMS.txt.
  # Update together with GODOT_VERSION.
  GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  GODOT_TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: gdformat --check
        run: |
          mkdir -p scripts tests
          gdformat --check scripts tests
      - name: gdlint
        run: gdlint scripts tests

  # The suite outgrew one 10 minute job, so it runs as parallel shards.
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
      - name: Import project
        run: godot --headless --import
      - name: Run GUT tests
        run: tools/run_tests.sh

  map-ids:
    # The matrix comes from TrackCatalog, so a new map needs no CI edit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      maps: ${{ steps.ids.outputs.maps }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
      - name: Import project
        run: godot --headless --import
      - name: List map ids
        id: ids
        run: |
          maps="$(godot --headless -s tools/print_map_ids.gd -- --json | tail -n 1)"
          echo "$maps"
          echo "maps=$maps" >> "$GITHUB_OUTPUT"

  # One job per map so the seed sweeps run in parallel. Pull requests run a shorter sweep; main runs the full one.
  race-seeds:
    needs: map-ids
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        map: ${{ fromJSON(needs.map-ids.outputs.maps) }}
    env:
      LAST_SEED: ${{ github.event_name == 'pull_request' && '8' || '20' }}
      MAP: ${{ matrix.map }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
      - name: Import project
        run: godot --headless --import
      - name: Race seeds (no jams)
        run: |
          tests/run_race_seeds.sh godot 1 "$LAST_SEED" "$MAP"
          MARBLES=20 tests/run_race_seeds.sh godot 1 "$LAST_SEED" "$MAP"
      - name: Race seeds under random events (no jams)
        run: |
          for event in low_gravity double_hazards lights_out bouncy thanos_snap; do
            EVENT="$event" MARBLES=20 tests/run_race_seeds.sh godot 1 "$LAST_SEED" "$MAP"
          done

  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm templates.tpz
      - name: Import project
        run: godot --headless --import
      - name: Stamp build info
        run: tools/stamp_build.sh "$GITHUB_SHA"
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
      - name: Check export output
        run: test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    needs: export-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install Playwright
        working-directory: tests/browser
        run: npm ci
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install Chromium
        working-directory: tests/browser
        env:
          CHROMIUM_CACHED: ${{ steps.chromium.outputs.cache-hit }}
        run: |
          if [ "$CHROMIUM_CACHED" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Play a round in the browser
        working-directory: tests/browser
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: tests/browser/results
          if-no-files-found: warn
          retention-days: 7

  deploy-pages:
    # Publish the tested export from main. Only this job gets the Pages permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, race-seeds, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
